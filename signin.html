<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>
    <form action="home.html">
    <div class="goog">
    <div id="google">
        <img src="google logo.png" alt="google logo" width="80px" height="80px">
    </div>
    <div id="sign">
        <h1>Sign in to Chrome</h1>
        <pre>Use your Google Account</pre>
    </div>
    </div>
    <div>
        <fieldset>
            <legend>Email or phone</legend >
            <input type="text" value="" name="Email or phone"  required />
        </fieldset>
    </div>
     <div id="forgot"> 
        <a href="forgot.html">Forgot email?</a>
    </div> 
    <div id="sodhi">
        <pre>Not your computer? Use Guest mode to sign in privately.</pre>
        <a href="#">Learn more about using Guest mode</a>
    </div>
    <div id="account">
        <a href="#">Create account</a>
    </div>
    
    <button class="button">Next</button>
</form>
      <div class="language-dropdown-container">
        <select id="language-select" class="language-select">
            <option value="en-US" selected>English (United States)</option>
            <option value="en-GB">English (United Kingdom)</option>
            <option value="es-ES">Español (España)</option>
            <option value="fr-FR">Français (France)</option>
            </select>
    </div>
    <div class="help">
        <pre>Help   Privacy   Terms</pre>
    </div>
</body>
</html>
