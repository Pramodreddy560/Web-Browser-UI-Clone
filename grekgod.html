<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Browser UI Clone</title>

    <link rel="stylesheet" href="grekgod.css">
</head>

<body>

    <main class="browser-home">

        <section class="shortcuts">

            <!-- CodeChef -->
            <a class="shortcut" href="https://www.codechef.com/dashboard" target="_blank">
                <div class="icon">
                    <img src="codechef.png" alt="CodeChef">
                </div>
                <span>CodeChef</span>
            </a>

            <!-- Gmail -->
            <a class="shortcut" href="https://mail.google.com/" target="_blank">
                <div class="icon">
                    <img src="Gmail.png" alt="Gmail">
                </div>
                <span>Gmail</span>
            </a>

            <!-- YouTube -->
            <a class="shortcut" href="https://www.youtube.com/" target="_blank">
                <div class="icon">
                    <img src="YouTube.png" alt="YouTube">
                </div>
                <span>YouTube</span>
            </a>

            <!-- MonkeyType -->
            <a class="shortcut" href="https://monkeytype.com/" target="_blank">
                <div class="icon">
                    <img src="MonkeyType.png" alt="MonkeyType">
                </div>
                <span>MonkeyType</span>
            </a>

            <!-- YouTube Music -->
            <a class="shortcut" href="https://music.youtube.com/" target="_blank">
                <div class="icon">
                    <img src="YouTube Music.png" alt="YouTube Music">
                </div>
                <span>YouTube Music</span>
            </a>

            <!-- LeetCode -->
            <a class="shortcut" href="https://leetcode.com/" target="_blank">
                <div class="icon">
                    <img src="LeetCode.png" alt="LeetCode">
                </div>
                <span>LeetCode</span>
            </a>

            <!-- Striver -->
            <a class="shortcut"
               href="https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2/"
               target="_blank">
                <div class="icon">
                    <img src="Strivrs.png" alt="Striver A2Z DSA">
                </div>
                <span>Striver A2Z</span>
            </a>

            <!-- GeeksforGeeks -->
            <a class="shortcut"
               href="https://www.geeksforgeeks.org/python-programming-language-tutorial/"
               target="_blank">
                <div class="icon">
                    <img src="geeksforgeeks.png" alt="GeeksforGeeks">
                </div>
                <span>GeeksforGeeks</span>
            </a>

            <!-- Jupyter -->
            <a class="shortcut" href="http://localhost:8888/tree" target="_blank">
                <div class="icon">
                    <img src="jupyter.png" alt="Jupyter Notebook">
                </div>
                <span>Jupyter</span>
            </a>

            <!-- GitHub -->
            <a class="shortcut" href="https://github.com/" target="_blank">
                <div class="icon">
                    <img src="GitHub2.png" alt="GitHub">
                </div>
                <span>GitHub</span>
            </a>

        </section>

    </main>

</body>
</html>
