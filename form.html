<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Employee Registration Form</h1>
    <form action="./Success.html">
        <fieldset>
            <legend>Title</legend>
             <label for="Mr.">Mr.</label>
        <input type="radio" value="Mr." name="gender"/>
       
         <label for="Mrs.">Mrs.</label>
        <input type="radio" value="Mrs." name="gender"/>
       
         <label for="Ms.">Ms.</label>
        <input type="radio" value="Ms." name="gender"/>
        </fieldset>
       
        <br>
        <br>
        <label for="First Name"> First Name</label>
        <input type="text" value="" name="First Name" required placeholder="enter firstname"/>
        <br>
        <br>
        <label for="Second Name"> Second Name</label>
        <input type="text" value="" name="Second Name" required placeholder="enter secondname"/>
        <br>
        <br>
        <label for="Mail Address"> Mail Address</label>
        <input type="text" value="" name="Mail Address" required />
        <br>
        <br>
        <h3> Enter DOB</h3>
        <input type="date" value="" name="date"/>
        <br>
        <br>
        <label for="City"> City</label>
        <input type="text" value="" name="City" required />
        <br>
        <br>
        <h3>State</h3>
        <label for="State"> Telangana</label >
        <input type="checkbox" value="Telangana" name="State" checked />

        <label for="State"> Andhra pradesh</label>
        <input type="checkbox" value="Andhra Pradesh" name="State"/>

        <label for="State"> Bihar</label>
        <input type="checkbox" value="Bihar" name="State"/>

        <label for="State"> Tamil Nadu</label>
        <input type="checkbox" value="Tamil Nadu" name="State"/>

        <label for="State"> Goa</label>
        <input type="checkbox" value="Goa" name="State"/>
        <br>
        <br>
        <h3>Upload an Photo</h3>
        <input type="file"/>
        <br>
        <br>
        <input type="submit" value="submit"/>
    </form>
</body>
</html>
